include=~/.config/fuzzel/colors.ini

[main]
font=monospace:size=13
prompt="❯ "
terminal=kitty -e
icons-enabled=yes

lines=10
width=35
horizontal-pad=20
vertical-pad=15
inner-pad=20
layer=overlay
exit-on-keyboard-focus-loss=yes
anchor=bottom
y-margin=25

[border]
width=2
radius=0

[key-bindings]
delete-line-forward=none
next=Control+j Down
prev=Control+k Up
