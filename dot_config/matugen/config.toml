[config]
reload_apps = true
source_color_index = 0


[templates.quickshell]
input_path = '~/.config/matugen/templates/Colors.qml'
output_path = '~/.config/quickshell/theme/Colors.qml'

[templates.niri]
input_path = '~/.config/matugen/templates/colors.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/colors'
post_hook = 'touch ~/.config/ghostty/config.ghostty'

[templates.neovim]
input_path = '~/.config/matugen/templates/neovim-colors.lua'
output_path = '~/.config/nvim/lua/config/colors.lua'

